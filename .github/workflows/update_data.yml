name: Auto-Update Hardware Prices & Promos

on:
  schedule:
    # Runs every 30 minutes 100% free on GitHub Actions
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run HardwareBarato Scraper
        run: |
          python scraper.py || true

      - name: Run Flash Promos & Coupon Radar with Cloud Alerts
        run: |
          python promo_radar.py --notify

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hardware_db*.json data/promos_cache*.json data/alert_config*.json data/notified_history*.json data/coupon_status*.json
          git diff --staged --quiet || (git commit -m "chore: auto-update hardware prices and promo coupons [skip ci]" && git pull --rebase origin main && git push origin main)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
