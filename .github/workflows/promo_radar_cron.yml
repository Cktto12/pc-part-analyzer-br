name: Promo Radar 24-7 Background Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes in the cloud (GitHub minimum)
  workflow_dispatch:       # Allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Promo Radar & Send Phone Notifications
        run: python server.py --cron-once

      - name: Commit updated promo cache & notified history to GitHub Pages
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/promos_cache*.json data/notified_history*.json data/coupon_status*.json data/hardware_db*.json || true
          git diff --staged --quiet || (git commit -m "chore(radar): auto-update live promos and notified history" && git pull --rebase origin main && git push origin main)
